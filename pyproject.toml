[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultron"
version = "0.1.0"
description = "Autonomous, cost-optimized tool-forging agent harness (Phase 1: safe executor + eval gates)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "autonomous-ultron maintainers" }]
keywords = ["agents", "sandbox", "docker", "eval", "cost-optimization"]

dependencies = [
    "pydantic>=2.7,<3",
    "litellm>=1.40",
    "httpx>=0.27",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ultron = "ultron.main:main"

[project.optional-dependencies]
schema = ["jsonschema>=4.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/ultron"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:ultron.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tools", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]

[tool.coverage.run]
source = ["src/ultron"]
